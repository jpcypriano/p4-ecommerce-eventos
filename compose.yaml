services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -h localhost -U ecommerce
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    healthcheck:
      test: redis-cli ping
      interval: 2s
      retries: 15

  api:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      banco:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: npm run worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  dados:
